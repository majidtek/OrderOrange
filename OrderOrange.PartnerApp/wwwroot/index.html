<!-- The app's host page: the browser portal's index.html (OrderOrange.RestaurantWeb/wwwroot)
     with the WebView runtime in place of the WebAssembly one. Keep the stylesheet and script
     list in step with that file when a version stamp there changes. -->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OrderOrange Partner</title>

    <script>
        // The portal fetches two map helpers from its own web host (/placesearch, /maplink).
        // The app has no such host: hand those two to .NET, which forwards them to the
        // partner host (AppConfig.PartnerHost). Every other request is left alone.
        (function () {
            var native = window.fetch.bind(window);
            window.fetch = function (input, init) {
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                var path = url.replace(/^https?:\/\/[^/]+/, '');
                if (/^\/(placesearch|maplink)\?/.test(path) && window.DotNet) {
                    return DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'HostFetch', path).then(function (r) {
                        return new Response(r.body, { status: r.status || 502, headers: { 'Content-Type': 'application/json' } });
                    });
                }
                return native(input, init);
            };
        })();
    </script>
</head>

    <script>
        // Printing inside the app (no RawBT, no separate till app, no print dialog).
        // • A settled invoice ("print direct") is printed by .NET from the order itself
        //   (HybridRoot → the built-in printer engine), so the page's own paths stand down.
        // • The Print button on a page that shows a receipt draws that receipt (html2canvas,
        //   as the browser portal already does for thermal printers) and sends the picture to
        //   the cashier printer.
        (function () {
            if (!window.mfPrint) window.mfPrint = {};
            window.mfPrint.isAndroid = function () { return false; };
            window.mfPrint.rawbtNow = function () { };
            window.mfPrint.direct = function () { };
            window.mfPrint.auto = function () { };

            var nativePrint = window.print ? window.print.bind(window) : null;

            async function printSlip(slip) {
                var dots = 0;
                try { dots = await DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'CashierDots'); } catch (e) { }
                // No cashier printer set up in the app: the system print dialog (Windows) as before.
                if (!dots) { if (nativePrint) nativePrint(); return; }
                // Draw at twice the paper width; the app scales it down to the printer's dots.
                var canvas = await html2canvas(slip, {
                    backgroundColor: '#ffffff', scale: (dots * 2) / slip.offsetWidth, logging: false,
                    onclone: function (doc) { doc.querySelectorAll('.rcpt').forEach(function (r) { r.classList.add('rawbt-bold'); }); }
                });
                var reply = await DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'PrintSlip', canvas.toDataURL('image/png'));
                if (reply.noPrinter) { if (nativePrint) nativePrint(); return; }
                if (!reply.ok) alert(reply.error || 'Printing failed');
            }

            window.print = function () {
                var slip = document.querySelector('.rcpt');
                if (slip && typeof html2canvas !== 'undefined' && window.DotNet) {
                    printSlip(slip).catch(function (e) { alert(String(e && e.message || e)); });
                    return;
                }
                if (nativePrint) nativePrint();
            };

            // Windows: the printer engine draws kitchen tickets and receipts here, inside the
            // app's own WebView2: the ticket HTML goes into an invisible frame and comes back as
            // a PNG at the printer's width. (Android draws them off-screen natively instead.)
            window.ooRenderHtml = function (html, dots, cssWidth) {
                return new Promise(function (resolve, reject) {
                    var frame = document.createElement('iframe');
                    frame.setAttribute('aria-hidden', 'true');
                    frame.style.cssText = 'position:fixed;left:-20000px;top:0;border:0;background:#fff;width:' + (cssWidth + 40) + 'px;height:200px';
                    var finished = false;
                    function done(err, value) {
                        if (finished) return; finished = true;
                        setTimeout(function () { frame.remove(); }, 0);
                        if (err) reject(err); else resolve(value);
                    }
                    setTimeout(function () { done(new Error('The ticket page did not render.')); }, 15000);
                    frame.onload = async function () {
                        try {
                            var doc = frame.contentDocument;
                            if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
                            await Promise.all(Array.prototype.map.call(doc.images, function (img) {
                                return img.complete ? null : new Promise(function (r) { img.onload = img.onerror = r; });
                            }));
                            var root = doc.body.firstElementChild || doc.body;
                            // A kitchen ticket sizes its text with CSS zoom (width = base / zoom). Drawing it
                            // without the zoom at the matching wider scale gives the same paper and lets
                            // html2canvas measure plain CSS pixels.
                            root.style.zoom = '1';
                            frame.style.height = (Math.ceil(doc.documentElement.scrollHeight) + 20) + 'px';
                            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
                            var width = root.offsetWidth || cssWidth;
                            var canvas = await html2canvas(root, { backgroundColor: '#ffffff', scale: (dots * 2) / width, logging: false });
                            done(null, canvas.toDataURL('image/png'));
                        } catch (e) { done(e); }
                    };
                    frame.srcdoc = html;
                    document.body.appendChild(frame);
                });
            };
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
