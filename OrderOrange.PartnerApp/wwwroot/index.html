     with the WebView runtime in place of the WebAssembly one. Keep the stylesheet and script
     list in step with that file when a version stamp there changes. -->

    <script>
        // The portal fetches two map helpers from its own web host (/placesearch, /maplink).
        // The app has no such host: hand those two to .NET, which forwards them to the
        // partner host (AppConfig.PartnerHost). Every other request is left alone.
        (function () {
            var native = window.fetch.bind(window);
            window.fetch = function (input, init) {
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                var path = url.replace(/^https?:\/\/[^/]+/, '');
                if (/^\/(placesearch|maplink)\?/.test(path) && window.DotNet) {
                    return DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'HostFetch', path).then(function (r) {
                        return new Response(r.body, { status: r.status || 502, headers: { 'Content-Type': 'application/json' } });
                    });
                }
                return native(input, init);
            };

            // A link that opens a new tab (the partner guide, map links, invoices) does nothing
            // in the Android web view, which has no tabs: send it through the page instead, and
            // the app opens any address outside itself in the device's browser.
            document.addEventListener('click', function (e) {
                var a = e.target && e.target.closest ? e.target.closest('a[target="_blank"]') : null;
                if (!a || !a.href || /^(javascript|blob|data):/i.test(a.href)) return;
                e.preventDefault();
                window.location.href = a.href;
            }, true);
        })();
    </script>
    <style>
        /* The app's own error screen (replaces the portal's dark bar): full page, branded, with
           Reload and the error's details, so a partner can send a screenshot that says something. */
        body #blazor-error-ui { position: fixed !important; inset: 0 !important; width: auto !important; height: auto !important;
            border-radius: 0 !important; padding: 24px !important; margin: 0 !important; z-index: 100000 !important;
            background: #FFF8F3 !important; color: #2b211a !important; box-shadow: none !important;
            font: 15px/1.5 "Segoe UI", system-ui, sans-serif !important; overflow: auto; }

        #blazor-error-ui .oo-err svg { width: 72px; height: 72px; }
        #blazor-error-ui .oo-err h2 { margin: 14px 0 6px; font-size: 22px; font-weight: 800; color: #2b211a; }

            font: 700 15px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; text-decoration: none; }
        #blazor-error-ui .oo-err .reload { background: #FF5A00; color: #fff !important; border-bottom: 0 !important; }

            margin: 18px 0 0; padding: 12px; max-height: 45vh; overflow: auto; background: #fff; border: 1px solid #eadfd5;
            border-radius: 10px; font: 12px/1.45 Consolas, monospace; color: #5b3a2a; }
        #blazor-error-ui .oo-err.open pre { display: block; }
        #blazor-error-ui .dismiss { display: none !important; }
    </style>
    <script>
        // Keep the last errors the runtime reports (it writes the .NET exception to console.error just
        // before it shows #blazor-error-ui), and put them under "Details" on the error screen.
        (function () {
            var errors = [];
            var original = console.error.bind(console);
            console.error = function () {
                try {
                    errors.push(Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : String(a); }).join(' '));
                    if (errors.length > 6) errors.shift();
                } catch (e) { }
                original.apply(console, arguments);
            };
            window.addEventListener('error', function (e) { errors.push(String(e.message) + (e.error && e.error.stack ? '\n' + e.error.stack : '')); });
            window.ooErrors = function () { return errors.slice(); };

            var words = {
                en: ['Something went wrong', 'The app ran into a problem on this screen. Reload to carry on — nothing on the server is lost.', 'Reload', 'Details', 'Copy', 'Copied'],
                ar: ['حدث خطأ ما', 'واجه التطبيق مشكلة في هذه الشاشة. أعد التحميل للمتابعة — لم يُفقد شيء على الخادم.', 'إعادة التحميل', 'التفاصيل', 'نسخ', 'تم النسخ'],
                fa: ['مشکلی پیش آمد', 'برنامه در این صفحه به مشکل خورد. برای ادامه دوباره بارگذاری کنید — چیزی روی سرور از دست نرفته است.', 'بارگذاری مجدد', 'جزئیات', 'کپی', 'کپی شد'],
                ur: ['کچھ غلط ہو گیا', 'ایپ کو اس اسکرین پر مسئلہ پیش آیا۔ جاری رکھنے کے لیے دوبارہ لوڈ کریں — سرور پر کچھ ضائع نہیں ہوا۔', 'دوبارہ لوڈ کریں', 'تفصیلات', 'کاپی', 'کاپی ہو گیا'],
            };
            function lang() { try { var l = (localStorage.getItem('mf.lang') || 'en').toLowerCase(); return words[l] ? l : 'en'; } catch (e) { return 'en'; } }

            document.addEventListener('DOMContentLoaded', function () {
                var ui = document.getElementById('blazor-error-ui');
                if (!ui) return;
                function fill() {
                    if (getComputedStyle(ui).display === 'none') return;
                    var l = lang(), w = words[l];
                    ui.setAttribute('dir', l === 'en' ? 'ltr' : 'rtl');
                    ui.querySelector('.t').textContent = w[0];
                    ui.querySelector('.s').textContent = w[1];
                    ui.querySelector('.reload').textContent = w[2];
                    ui.querySelector('.d').textContent = w[3];
                    ui.querySelector('.c').textContent = w[4];
                    ui.querySelector('pre').textContent = (errors.length ? errors.join('\n\n') : '(no details)') +
                        '\n\n' + navigator.userAgent + '\n' + location.href;
                }
                new MutationObserver(fill).observe(ui, { attributes: true, attributeFilter: ['style', 'class'] });
                ui.querySelector('.d').addEventListener('click', function () { ui.querySelector('.oo-err').classList.toggle('open'); });
                ui.querySelector('.c').addEventListener('click', function () {
                    var text = ui.querySelector('pre').textContent, btn = this;
                    function done() { btn.textContent = words[lang()][5]; }
                    try { navigator.clipboard.writeText(text).then(done, function () { }); } catch (e) { }
                });
            });
        })();
    </script>

    <script>
        // Printing inside the app (no RawBT, no separate till app, no print dialog).
        // • A settled invoice ("print direct") is printed by .NET from the order itself
        //   (HybridRoot → the built-in printer engine), so the page's own paths stand down.
        // • The Print button on a page that shows a receipt draws that receipt (html2canvas,
        //   as the browser portal already does for thermal printers) and sends the picture to
        //   the cashier printer.
        (function () {
            if (!window.mfPrint) window.mfPrint = {};
            window.mfPrint.isAndroid = function () { return false; };
            window.mfPrint.rawbtNow = function () { };
            window.mfPrint.direct = function () { };
            window.mfPrint.auto = function () { };

            var nativePrint = window.print ? window.print.bind(window) : null;

            async function printSlip(slip) {
                var dots = 0;
                try { dots = await DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'CashierDots'); } catch (e) { }
                // No cashier printer set up in the app: the system print dialog (Windows) as before.
                if (!dots) { if (nativePrint) nativePrint(); return; }
                // Draw at twice the paper width; the app scales it down to the printer's dots.
                var canvas = await html2canvas(slip, {
                    backgroundColor: '#ffffff', scale: (dots * 2) / slip.offsetWidth, logging: false,
                    onclone: function (doc) { doc.querySelectorAll('.rcpt').forEach(function (r) { r.classList.add('rawbt-bold'); }); }
                });
                var reply = await DotNet.invokeMethodAsync('OrderOrange.PartnerApp', 'PrintSlip', canvas.toDataURL('image/png'));
                if (reply.noPrinter) { if (nativePrint) nativePrint(); return; }
                if (!reply.ok) alert(reply.error || 'Printing failed');
            }

            window.print = function () {
                var slip = document.querySelector('.rcpt');
                if (slip && typeof html2canvas !== 'undefined' && window.DotNet) {
                    printSlip(slip).catch(function (e) { alert(String(e && e.message || e)); });
                    return;
                }
                if (nativePrint) nativePrint();
            };

            // Windows: the printer engine draws kitchen tickets and receipts here, inside the
            // app's own WebView2: the ticket HTML goes into an invisible frame and comes back as
            // a PNG at the printer's width. (Android draws them off-screen natively instead.)
            window.ooRenderHtml = function (html, dots, cssWidth) {
                return new Promise(function (resolve, reject) {
                    var frame = document.createElement('iframe');
                    frame.setAttribute('aria-hidden', 'true');
                    frame.style.cssText = 'position:fixed;left:-20000px;top:0;border:0;background:#fff;width:' + (cssWidth + 40) + 'px;height:200px';
                    var finished = false;
                    function done(err, value) {
                        if (finished) return; finished = true;
                        setTimeout(function () { frame.remove(); }, 0);
                        if (err) reject(err); else resolve(value);
                    }
                    setTimeout(function () { done(new Error('The ticket page did not render.')); }, 15000);
                    frame.onload = async function () {
                        try {
                            var doc = frame.contentDocument;
                            if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
                            await Promise.all(Array.prototype.map.call(doc.images, function (img) {
                                return img.complete ? null : new Promise(function (r) { img.onload = img.onerror = r; });
                            }));
                            var root = doc.body.firstElementChild || doc.body;
                            // A kitchen ticket sizes its text with CSS zoom (width = base / zoom). Drawing it
                            // without the zoom at the matching wider scale gives the same paper and lets
                            // html2canvas measure plain CSS pixels.
                            root.style.zoom = '1';
                            frame.style.height = (Math.ceil(doc.documentElement.scrollHeight) + 20) + 'px';
                            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
                            var width = root.offsetWidth || cssWidth;
                            var canvas = await html2canvas(root, { backgroundColor: '#ffffff', scale: (dots * 2) / width, logging: false });
                            done(null, canvas.toDataURL('image/png'));
                        } catch (e) { done(e); }
                    };
                    frame.srcdoc = html;
                    document.body.appendChild(frame);
                });
            };
        })();
    </script>
