<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OrderOrange Admin — Control Panel</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Vazirmatn:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet" />

</head>

<body>
    <div id="app">
        <div class="mf-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff7f0;font-family:system-ui,sans-serif;color:#7a4a2a">
            <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="oo-b-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="0.55" stop-color="#FF5A00"/><stop offset="1" stop-color="#E64500"/></linearGradient></defs><path fill="url(#oo-b-paper)" d="M20 15h24a5 5 0 0 1 5 5v38l-5.8-4.2L37.4 58l-5.8-4.2L25.8 58 20 53.8 14.2 58V20a5 5 0 0 1 5-5z"/><rect x="20.5" y="27" width="23" height="4" rx="2" fill="#fff" opacity=".95"/><rect x="20.5" y="35" width="16" height="4" rx="2" fill="#fff" opacity=".95"/><rect x="20.5" y="43" width="23" height="5" rx="2.5" fill="#FFD8BF"/></svg>
            <div style="font-weight:700;font-size:15px">OrderOrange Admin</div>
            <div style="width:220px;height:6px;border-radius:999px;background:#ffd8bf;overflow:hidden"><div style="height:100%;width:var(--blazor-load-percentage,0%);background:linear-gradient(90deg,#ff8a3d,#ff5a00);transition:width .3s"></div></div>
            <div style="font-size:12.5px;opacity:.7">Loading <span id="mf-boot-pct"></span></div>
            <script>(function(){var el=document.getElementById('mf-boot-pct');function tick(){var v=getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage-text').replace(/"/g,'').trim();if(el)el.textContent=v||'';if(document.getElementById('mf-boot-pct'))setTimeout(tick,200);}tick();})();</script>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        <span class="msg">Something went wrong.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

</body>

</html>
