<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OrderOrange">
  <title>OrderOrange</title>
  <!--
    An invoice with an orange leaf: the receipt says "order", the leaf and the colour
    say "orange". Built from solid shapes with chunky detail so it still reads at 16px.
  -->
  <defs>
    <linearGradient id="oo-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.55" stop-color="#FF5A00"/>
      <stop offset="1" stop-color="#E64500"/>
    </linearGradient>
    <linearGradient id="oo-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9E4F"/>
      <stop offset="1" stop-color="#57C97A"/>
    </linearGradient>
  </defs>

  <!-- The invoice: rounded head, torn bottom edge. -->
  <path fill="url(#oo-paper)"
        d="M20 15h24a5 5 0 0 1 5 5v38l-5.8-4.2L37.4 58l-5.8-4.2L25.8 58 20 53.8 14.2 58V20a5 5 0 0 1 5-5z"
        transform="translate(0.4 0)"/>

  <!-- Stem and leaf, growing out of the top of the bill. -->
  <path fill="#1F7A3C" d="M32 16.6c-.7 0-1.2-.6-1.2-1.2V11c0-.7.5-1.2 1.2-1.2s1.2.5 1.2 1.2v4.4c0 .6-.5 1.2-1.2 1.2z"/>
  <path fill="url(#oo-leaf)"
        d="M33.4 12.2c2.9-4.3 8-5.9 12-5.3.8.1 1.3 1 1 1.7-1.4 3.8-4.8 7.9-10 8.2-1.4.1-2.6-.4-3.4-1.2-.9-.9-.8-2.3.4-3.4z"/>

  <!-- Invoice lines: two entries and a heavier total. -->
  <rect x="20.5" y="27" width="23" height="4" rx="2" fill="#FFFFFF" opacity=".95"/>
  <rect x="20.5" y="35" width="16" height="4" rx="2" fill="#FFFFFF" opacity=".95"/>
  <rect x="20.5" y="43" width="23" height="5" rx="2.5" fill="#FFD8BF"/>
</svg>
